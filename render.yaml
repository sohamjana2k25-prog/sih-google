services:
  # ─── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: apaar-sentinel-backend
    runtime: node
    rootDir: backend
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: DATABASE_PATH=/data/apaar_sentinel.sqlite node dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: apaar-sentinel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://apaar-sentinel-backend.onrender.com
